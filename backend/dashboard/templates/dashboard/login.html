<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Login - Pedra Norte</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #eef0f2;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .login-wrapper {
            width: 100%;
        }

        .login-box {
            max-width: 390px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #d7d7d7;
            padding: 28px;
        }

        .system-name {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .system-subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-label {
            font-size: 14px;
            color: #333;
        }

        .form-control {
            border-radius: 3px;
            font-size: 14px;
            padding: 10px 12px;
        }

        .btn-login {
            background: #2f343a;
            color: white;
            border: 1px solid #24282d;
            border-radius: 3px;
            padding: 10px 12px;
            font-weight: 600;
            width: 100%;
        }

        .btn-login:hover {
            background: #24282d;
            color: white;
        }

        .login-footer {
            margin-top: 18px;
            font-size: 12px;
            color: #777;
            text-align: center;
        }

        .alert {
            border-radius: 3px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-box">
            <div class="system-name">Pedra Norte</div>
            <div class="system-subtitle">
                Acesso ao dashboard de medições
            </div>

            {% if form.errors %}
                <div class="alert alert-danger">
                    Usuário ou senha inválidos.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="id_username" class="form-label">
                        Usuário
                    </label>

                    <input
                        type="text"
                        name="username"
                        id="id_username"
                        class="form-control"
                        required
                        autofocus
                    >
                </div>

                <div class="mb-4">
                    <label for="id_password" class="form-label">
                        Senha
                    </label>

                    <input
                        type="password"
                        name="password"
                        id="id_password"
                        class="form-control"
                        required
                    >
                </div>

                <button type="submit" class="btn-login">
                    Entrar
                </button>
            </form>

            <div class="login-footer">
                Sistema interno de acompanhamento de medições
            </div>
        </div>
    </div>

</body>
</html>
